name: Feature request
description: Suggest an idea or enhancement for Ohm
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please avoid including private data
        (home addresses, device serials, live tokens) in this request.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or frustrating today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
