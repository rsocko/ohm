name: Bug report
description: Report a problem with Ohm
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        **Do not include real credentials, tokens, home addresses, or other
        personal/private data in this report.** If your issue involves a
        potential security vulnerability, please use
        [private vulnerability reporting](https://github.com/rsocko/ohm/security/advisories/new)
        instead of a public issue — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include a minimal example if possible.
      placeholder: |
        1. Run `npm run dev` (or `npm run dev:demo`)
        2. Navigate to ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD`, or the release/tag you're on.
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local dev (npm run dev)
        - Demo mode (npm run dev:demo)
        - Production build (npm run build && npm run preview)
        - Other
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, etc. Redact any private data first.
    validations:
      required: false
