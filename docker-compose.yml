# Docker Compose for deploying the Ohm PWA
# Local dev-parity copy — the homelab-config repo's stacks/server-mini/ohm/compose.yaml
# is the source of truth for the running deployment (pulls from registry.example.com).

services:
  ohm:
    build: .
    container_name: ohm
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohm.rule=Host(`ohm.example.com`)"
      - "traefik.http.routers.ohm.entrypoints=web"
      - "traefik.http.services.ohm.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"

    healthcheck:
      # Use 127.0.0.1 — Alpine resolves "localhost" to ::1 (IPv6) but
      # adapter-node binds 0.0.0.0 (IPv4 only), causing false failures.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  traefik:
    external: true
