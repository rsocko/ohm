# Docker Compose for running Ohm locally.

services:
  ohm:
    build: .
    container_name: ohm
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ohm-data:/app/data

    healthcheck:
      # Use 127.0.0.1 — Alpine resolves "localhost" to ::1 (IPv6) but
      # adapter-node binds 0.0.0.0 (IPv4 only), causing false failures.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ohm-data:
